<!doctype html>
<!--
  mosaic-reveal: HyperFrames footage treatment (reveal / texture)

  One piece of footage is shown through a cols×rows grid of cells. Each
  cell is one of: INTACT (the footage in place), BLACK, or DISPLACED
  (the same footage offset a whole cell, or scaled 1.5× around the frame
  center, so the cell shows a different crop). A focus region — the cells
  within max(1, min(cols,rows)/4) cells of the focal point — always stays
  INTACT, so a
  face or product survives the treatment. Optional hairline gridlines and
  a scanline texture sit over everything.

  The media is a SLOT. Callers supply it by placing an inert template
  anywhere in the HOST page (templates never render, and the runtime
  wipes the host clip's own children on mount):

    <template data-slot="mosaic-reveal-media"> ... </template>

  Direct img/video children are stretched to cover the frame and cloned
  once per displacement recipe (with their data-start/data-duration —
  the runtime drives every timed video it finds, so the copies stay on
  the same frame; give the slot video the a-roll's timing to keep the
  mosaic continuous with the footage underneath). When the slot is
  absent, the primitive renders a neutral gradient tile.

  Variables (declared in data-composition-variables below):
    - cols / rows: grid pitch (cols 4–12, rows 3–8).
    - black: share of cells that are solid black (0–0.6).
    - displaced: share of cells that show an offset or zoomed crop (0–0.6).
    - seed: layout seed; a different seed is a different mosaic.
    - focus ("upper" | "center" | "none"): region kept intact. "upper"
      keeps cells near (0.5, 0.35) — where a face sits — clear.
    - gridlines ("hairline" | "none"): 1px lines at ~22% white, blended in
      difference mode so they read on light and dark footage.
    - texture ("scanlines" | "none"): 2px repeating lines at ~12% black.
    - reveal ("hold" | "assemble" | "dissolve"): hold is a static mosaic;
      assemble starts all black and cells pop to their final state in a
      seeded stagger; dissolve starts as intact footage and cells drop to
      their final state. The stagger runs 1.2 s at reveal_at.
    - reveal_at (seconds): when the reveal starts; clamped so the 1.2 s
      stagger finishes inside the clip.

  Determinism:
    The cell assignment (kind per cell, displacement recipe, stagger
    order) is a pure function of (cols, rows, black, displaced, seed,
    focus) computed exactly once at mount with a fixed-step LCG. Every
    frame derives from (assignment, t) on one paused GSAP timeline: the
    reveal is plain opacity tweens, never per-frame state, no
    Math.random, no wall clock. Sizes come from the host box measured
    once at mount, so the component works at any frame size.
-->
<html
  lang="en"
  data-composition-id="mosaic-reveal"
  data-composition-duration="5"
  data-composition-variables='[
    { "id": "cols", "type": "number", "role": "style", "label": "Columns", "description": "Grid columns.", "default": 8, "min": 4, "max": 12, "step": 1 },
    { "id": "rows", "type": "number", "role": "style", "label": "Rows", "description": "Grid rows.", "default": 5, "min": 3, "max": 8, "step": 1 },
    { "id": "black", "type": "number", "role": "style", "label": "Black cells", "description": "Share of cells that are solid black.", "default": 0.35, "min": 0, "max": 0.6, "step": 0.05 },
    { "id": "displaced", "type": "number", "role": "style", "label": "Displaced cells", "description": "Share of cells that show a shifted or zoomed crop of the same frame.", "default": 0.3, "min": 0, "max": 0.6, "step": 0.05 },
    { "id": "seed", "type": "number", "role": "style", "label": "Seed", "description": "Layout seed; a different seed is a different mosaic.", "default": 7, "min": 1, "max": 9999, "step": 1 },
    { "id": "focus", "type": "enum", "role": "style", "label": "Focus", "description": "Region kept intact: upper keeps the upper-middle clear (a face), center keeps the middle, none lets every cell be treated.", "default": "upper", "options": [{ "value": "upper", "label": "Upper" }, { "value": "center", "label": "Center" }, { "value": "none", "label": "None" }] },
    { "id": "gridlines", "type": "enum", "role": "style", "label": "Gridlines", "description": "1px hairlines between cells at ~22% white, difference-blended so they read on light and dark footage.", "default": "hairline", "options": [{ "value": "hairline", "label": "Hairline" }, { "value": "none", "label": "None" }] },
    { "id": "texture", "type": "enum", "role": "style", "label": "Texture", "description": "2px repeating scanlines at ~12% black over the whole frame.", "default": "scanlines", "options": [{ "value": "scanlines", "label": "Scanlines" }, { "value": "none", "label": "None" }] },
    { "id": "reveal", "type": "enum", "role": "timing", "label": "Reveal", "description": "hold: static mosaic; assemble: cells pop in from black in a seeded stagger; dissolve: cells drop out of the intact frame.", "default": "assemble", "options": [{ "value": "hold", "label": "Hold" }, { "value": "assemble", "label": "Assemble" }, { "value": "dissolve", "label": "Dissolve" }] },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Reveal at", "description": "Seconds from mount start when the reveal runs (1.2 s).", "default": 0, "min": 0, "max": 10, "step": 0.1, "unit": "s" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Mosaic Reveal</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="mosaic-reveal" data-duration="5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #000;
          }

          .msr-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .msr-stage,
          .msr-layer,
          .msr-overlay {
            position: absolute;
            inset: 0;
          }

          .msr-media {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
          }

          .msr-layer {
            will-change: clip-path, opacity;
          }

          .msr-cell {
            position: absolute;
            background: #000;
          }

          .msr-cover {
            position: absolute;
            background: #000;
            will-change: opacity;
          }

          .msr-tile {
            background: linear-gradient(145deg, #26282e 0%, #17181c 55%, #101114 100%);
          }

          .msr-overlay {
            pointer-events: none;
          }
        </style>

        <div
          id="mosaic-reveal-clip"
          class="msr-clip clip"
          data-start="0"
          data-duration="5"
          data-track-index="0"
        >
          <div class="msr-stage">
            <div class="msr-layer msr-intact"></div>
            <div class="msr-layer msr-disp msr-disp-0"></div>
            <div class="msr-layer msr-disp msr-disp-1"></div>
            <div class="msr-layer msr-disp msr-disp-2"></div>
            <div class="msr-blacks"></div>
            <div class="msr-covers"></div>
            <div class="msr-overlay msr-gridlines"></div>
            <div class="msr-overlay msr-scanlines"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          ;(function () {
            'use strict'

            var root = document.getElementById('root')
            var intactLayer = root.querySelector('.msr-intact')
            var blacksBox = root.querySelector('.msr-blacks')
            var coversBox = root.querySelector('.msr-covers')
            var gridlinesEl = root.querySelector('.msr-gridlines')
            var scanlinesEl = root.querySelector('.msr-scanlines')
            var dispLayers = [
              root.querySelector('.msr-disp-0'),
              root.querySelector('.msr-disp-1'),
              root.querySelector('.msr-disp-2')
            ]
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {}

            function num(value, fallback, min, max) {
              var n = Number(value)
              if (!isFinite(n)) n = fallback
              return Math.max(min, Math.min(max, n))
            }

            var cols = Math.round(num(vars.cols, 8, 4, 12))
            var rows = Math.round(num(vars.rows, 5, 3, 8))
            var blackShare = num(vars.black, 0.35, 0, 0.6)
            var dispShare = num(vars.displaced, 0.3, 0, 0.6)
            var seed = Math.round(num(vars.seed, 7, 1, 9999)) >>> 0
            var focus = vars.focus === 'center' || vars.focus === 'none' ? vars.focus : 'upper'
            var gridlines = vars.gridlines === 'none' ? 'none' : 'hairline'
            var texture = vars.texture === 'none' ? 'none' : 'scanlines'
            var reveal =
              vars.reveal === 'hold' || vars.reveal === 'dissolve' ? vars.reveal : 'assemble'

            // Envelope: a static HOLD except for the reveal window.
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || '5'))
            var REVEAL = Math.min(1.2, Math.max(0.3, duration))
            var revealAt = num(vars.reveal_at, 0, 0, Math.max(0, duration - REVEAL - 0.05))

            // Layout basis, fixed once at mount.
            var box = root.getBoundingClientRect()
            var cssW = Math.max(1, Math.round(box.width) || 1920)
            var cssH = Math.max(1, Math.round(box.height) || 1080)
            var cw = cssW / cols
            var ch = cssH / rows

            // LCG, same law as halftone-dissolve: assignment, recipes and
            // stagger are pure functions of the seed.
            var state = seed || 1
            function next() {
              state = (Math.imul(1664525, state) + 1013904223) >>> 0
              return state / 4294967296
            }

            var fRadius = Math.max(1, Math.round(Math.min(cols, rows) / 4))
            var fcx = focus === 'none' ? -100 : Math.round(0.5 * (cols - 1))
            var fcy =
              focus === 'none' ? -100 : Math.round((focus === 'center' ? 0.5 : 0.35) * (rows - 1))
            var cells = []
            for (var r = 0; r < rows; r += 1) {
              for (var c = 0; c < cols; c += 1) {
                var x = Math.round(c * cw)
                var y = Math.round(r * ch)
                cells.push({
                  c: c,
                  r: r,
                  x: x,
                  y: y,
                  w: Math.round((c + 1) * cw) - x,
                  h: Math.round((r + 1) * ch) - y,
                  inFocus: Math.max(Math.abs(c - fcx), Math.abs(r - fcy)) <= fRadius,
                  k: next(),
                  recipe: Math.floor(next() * 3),
                  stagger: next(),
                  kind: 'intact'
                })
              }
            }
            // Sort the treatable cells by a seeded key, then take the shares
            // off the top: the layout is a pure function of the inputs.
            var others = cells
              .filter(function (cell) {
                return !cell.inFocus
              })
              .sort(function (a, b) {
                return a.k - b.k
              })
            var nBlack = Math.round(others.length * blackShare)
            var nDisp = Math.round(others.length * dispShare)
            for (var i = 0; i < others.length; i += 1) {
              others[i].kind = i < nBlack ? 'black' : i < nBlack + nDisp ? 'displaced' : 'intact'
            }
            var byRecipe = [[], [], []]
            for (var j = 0; j < others.length; j += 1) {
              var cell = others[j]
              if (cell.kind === 'displaced') byRecipe[cell.recipe].push(cell)
            }

            // MEDIA. The slot template lives at HOST DOCUMENT level (the
            // mount wipes host-clip children, and templates never render);
            // its img/video is cloned once per layer, cover-fit.
            var hostDoc = root.ownerDocument
            var mediaEl = null
            try {
              var slotTemplate = hostDoc.querySelector('template[data-slot="mosaic-reveal-media"]')
              if (slotTemplate) {
                var content = hostDoc.importNode(slotTemplate.content, true)
                mediaEl = content.querySelector('img, video')
              }
            } catch (error) {
              mediaEl = null
            }
            var mediaSerial = 0
            function makeMedia() {
              if (mediaEl) {
                var copy = mediaEl.cloneNode(true)
                // Keep data-start/data-duration: the runtime drives every
                // timed <video> it finds, which keeps the copies in sync
                // with each other and the footage underneath.
                copy.id = mediaEl.id
                  ? mediaEl.id + '-copy-' + mediaSerial
                  : 'msr-media-' + mediaSerial
                mediaSerial += 1
                return copy
              }
              var tile = hostDoc.createElement('div')
              tile.className = 'msr-tile msr-media'
              return tile
            }

            var base = makeMedia()
            base.classList.add('msr-media')
            intactLayer.appendChild(base)

            // One displaced copy per recipe, clipped to the union of its
            // cells. (a) shifts a whole column, (b) a whole row, (c) scales
            // 1.5 around the frame center — each shows a different crop.
            for (var d = 0; d < 3; d += 1) {
              var layer = dispLayers[d]
              var rects = byRecipe[d]
              if (rects.length === 0) {
                layer.style.display = 'none'
                continue
              }
              var copy = makeMedia()
              copy.classList.add('msr-media')
              if (d === 0) {
                copy.style.left = -cw + 'px'
                copy.style.width = 'calc(100% + ' + cw + 'px)'
              } else if (d === 1) {
                copy.style.top = -ch + 'px'
                copy.style.height = 'calc(100% + ' + ch + 'px)'
              } else {
                copy.style.transform = 'scale(1.5)'
              }
              var parts = rects.map(function (cell) {
                return (
                  'M ' +
                  cell.x +
                  ' ' +
                  cell.y +
                  ' h ' +
                  cell.w +
                  ' v ' +
                  cell.h +
                  ' h ' +
                  -cell.w +
                  ' Z'
                )
              })
              layer.style.clipPath = 'path("' + parts.join(' ') + '")'
              layer.appendChild(copy)
            }

            // BLACK cells: one div each, always black in the held state.
            var blackDivs = []
            for (var n = 0; n < others.length; n += 1) {
              var bc = others[n]
              if (bc.kind !== 'black') continue
              var b = hostDoc.createElement('div')
              b.className = 'msr-cell'
              b.style.left = bc.x + 'px'
              b.style.top = bc.y + 'px'
              b.style.width = bc.w + 'px'
              b.style.height = bc.h + 'px'
              blacksBox.appendChild(b)
              blackDivs.push({ el: b, stagger: bc.stagger })
            }

            // Covers for the assemble reveal: every non-black cell — focus
            // cells included, so the reveal scatters instead of the focus
            // block popping first — starts hidden under black, then pops.
            var covers = []
            if (reveal === 'assemble') {
              for (var m = 0; m < cells.length; m += 1) {
                var cc = cells[m]
                if (cc.kind === 'black') continue
                var cv = hostDoc.createElement('div')
                cv.className = 'msr-cover'
                cv.style.left = cc.x + 'px'
                cv.style.top = cc.y + 'px'
                cv.style.width = cc.w + 'px'
                cv.style.height = cc.h + 'px'
                coversBox.appendChild(cv)
                covers.push({ el: cv, stagger: cc.stagger })
              }
            }

            if (gridlines === 'hairline') {
              // difference blending keeps the lines readable on light and
              // dark footage alike (plain white vanishes on near-white).
              gridlinesEl.style.mixBlendMode = 'difference'
              gridlinesEl.style.background =
                'repeating-linear-gradient(to right, rgba(255,255,255,0.22) 0px, rgba(255,255,255,0.22) 1px, transparent 1px, transparent ' +
                cw +
                'px),' +
                'repeating-linear-gradient(to bottom, rgba(255,255,255,0.22) 0px, rgba(255,255,255,0.22) 1px, transparent 1px, transparent ' +
                ch +
                'px)'
            }
            if (texture === 'scanlines') {
              scanlinesEl.style.background =
                'repeating-linear-gradient(to bottom, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 2px)'
            }

            var tl = gsap.timeline({ paused: true })
            // Anchor tween: spans the full duration so holds keep tl.time()
            // honest; the reveal itself is plain opacity tweens.
            tl.to({ t: 0 }, { t: 1, duration: duration, ease: 'none' }, 0)

            var visibleDisp = dispLayers.filter(function (layer) {
              return layer.style.display !== 'none'
            })

            if (reveal === 'assemble') {
              gsap.set(visibleDisp, { opacity: 0 })
              for (var q = 0; q < covers.length; q += 1) {
                tl.to(
                  covers[q].el,
                  { opacity: 0, duration: 0.25, ease: 'power1.out' },
                  revealAt + covers[q].stagger * (REVEAL - 0.25)
                )
              }
              for (var e = 0; e < visibleDisp.length; e += 1) {
                tl.to(
                  visibleDisp[e],
                  { opacity: 1, duration: 0.35, ease: 'power1.out' },
                  revealAt + 0.1 + e * 0.3
                )
              }
            } else if (reveal === 'dissolve') {
              gsap.set(visibleDisp, { opacity: 0 })
              gsap.set(
                blackDivs.map(function (b) {
                  return b.el
                }),
                { opacity: 0 }
              )
              for (var f = 0; f < blackDivs.length; f += 1) {
                tl.to(
                  blackDivs[f].el,
                  { opacity: 1, duration: 0.25, ease: 'power1.out' },
                  revealAt + blackDivs[f].stagger * (REVEAL - 0.25)
                )
              }
              for (var g = 0; g < visibleDisp.length; g += 1) {
                tl.to(
                  visibleDisp[g],
                  { opacity: 1, duration: 0.35, ease: 'power1.out' },
                  revealAt + 0.1 + g * 0.3
                )
              }
            }
            // reveal === "hold": the mosaic is static for the whole clip.

            tl.seek(0)
            window.__timelines = window.__timelines || {}
            window.__timelines['mosaic-reveal'] = tl
          })()
        </script>
      </div>
    </template>
  </body>
</html>
