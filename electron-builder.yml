appId: com.fozagtx.luca
productName: Luca
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/@hyperframes/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: ${name}-${version}-${arch}.${ext}
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    - NSMicrophoneUsageDescription: Luca needs the microphone for voice input.
    - NSDocumentsFolderUsageDescription: Luca opens video projects from your folders.
    - NSDownloadsFolderUsageDescription: Luca opens video projects from your folders.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish: null
