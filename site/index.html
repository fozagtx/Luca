<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luca — makes your explainer video</title>
    <meta
      name="description"
      content="Luca is a macOS video editor you talk to. Describe the video, drop a voiceover or footage, and Luca makes it — on your own Claude subscription."
    />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <meta property="og:title" content="Luca — makes your explainer video" />
    <meta
      property="og:description"
      content="Luca is a macOS video editor you talk to. Describe the video, drop a voiceover or footage, and Luca makes it — on your own Claude subscription."
    />
    <meta property="og:url" content="https://fozagtx.github.io/Luca/" />
    <meta property="og:image" content="https://fozagtx.github.io/Luca/assets/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://fozagtx.github.io/Luca/" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="nav">
      <a href="https://github.com/fozagtx/Luca">GitHub</a>
    </nav>
    <main class="hero">
      <img class="logo anim" src="assets/logo.png" alt="" width="64" height="64" />
      <h1 class="anim">
        Luca makes your explainer video.<br /><span class="muted">You just describe it.</span>
      </h1>
      <a class="cta anim" href="https://github.com/fozagtx/Luca/releases">Download for macOS</a>
      <div class="runs-on anim">
        <span class="tiles">
          <span class="tile"><img src="assets/luca-avatar.png" alt="Luca" /></span>
          <span class="tile tile-dark" style="z-index: 10"
            ><img src="assets/claude.svg" alt="Claude Code"
          /></span>
          <span
            class="tile tile-dark tile-soon"
            style="z-index: 20"
            title="Codex support is coming"
            aria-label="Codex (coming soon)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5 3h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7.6l-3.7 3.2c-.6.5-1.7.1-1.7-.8V17H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"
                fill="#8b8df5"
              />
              <path
                d="M8 8l3 3-3 3M13 14h3.5"
                stroke="#1c1917"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
            </svg>
          </span>
        </span>
        Runs on Claude Code · Codex soon · macOS 13+
      </div>
      <div class="frame anim">
        <img
          src="assets/hero.png"
          alt="Luca editing an explainer: live preview, timeline and chat"
          width="3026"
          height="1694"
          style="display: block; width: 100%; height: auto"
        />
      </div>
    </main>
  </body>
</html>
